<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/leaf.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Leaf & Bloom — a Cebu botanical studio for plants, florals, and event styling. Priced in pesos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Leaf &amp; Bloom — Botanical studio in Cebu</title>
    <script>
      try {
        var t = localStorage.getItem('lb_theme')
        if (t) {
          try {
            t = JSON.parse(t)
          } catch (e) {}
        }
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        if (t === 'dark') document.documentElement.classList.add('dark')
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <p
        style="
          margin: 4rem auto;
          max-width: 28rem;
          padding: 0 1.25rem;
          font-family: system-ui, sans-serif;
          color: #5a554c;
          text-align: center;
          line-height: 1.5;
        "
      >
        Loading Leaf &amp; Bloom…
        <br />
        <span style="font-size: 0.875rem">
          If this stays blank, run
          <code style="font-size: 0.85em">npm run dev</code>
          (do not open this file directly).
        </span>
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
